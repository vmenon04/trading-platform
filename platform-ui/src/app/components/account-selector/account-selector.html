<section class="account-selector">
  <button type="button" class="account-trigger" (click)="toggle()" [attr.aria-expanded]="isOpen" aria-haspopup="listbox">
    <span class="account-icon">▥</span>
    <span class="account-copy">
      <strong>{{ accountType }}</strong>
      <small>{{ selectedLabel() }}</small>
    </span>
    <span class="account-chevron" [class.open]="isOpen" aria-hidden="true">⌄</span>
  </button>

  @if (isOpen) {
    <div class="account-menu" role="listbox" aria-label="Investment accounts">
      @for (option of account.accounts(); track option.accountId) {
        <button type="button" class="account-option" [class.selected]="option.accountId === account.accountId()" (click)="selectAccount(option.accountId)" role="option" [attr.aria-selected]="option.accountId === account.accountId()">
          <span class="account-icon">▥</span>
          <span class="account-copy"><strong>{{ accountType }}</strong><small>{{ accountNumber(option.accountId) }}</small></span>
        </button>
      } @empty {
        <p class="account-empty">No trading account yet</p>
      }
      @if (account.accounts().length > 0) {
        <button type="button" class="account-option open-account" (click)="askToOpenAccount()">
          <span class="account-icon">+</span>
          <span class="account-copy"><strong>Open new account</strong><small>{{ accountType }}</small></span>
        </button>
      }
    </div>
  }
</section>

<!-- a native modal dialog renders in the top layer, so the navbar's stacking context can't put it behind the page -->
<dialog #confirmDialog class="confirm-dialog" role="alertdialog" aria-labelledby="open-account-title" (cancel)="onDialogCancel($event)" (click)="onDialogClick($event)">
  <section class="confirm-content">
    <h2 id="open-account-title">Open a new account?</h2>
    @if (openError()) {
      <p class="confirm-error" role="alert">{{ openError() }}</p>
    }
    <div class="dialog-actions">
      <button type="button" (click)="cancelOpenAccount()" [disabled]="opening()">Cancel</button>
      <button type="button" class="primary" (click)="confirmOpenAccount()" [disabled]="opening()" autofocus>{{ opening() ? 'Opening…' : 'Yes, open account' }}</button>
    </div>
  </section>
</dialog>
