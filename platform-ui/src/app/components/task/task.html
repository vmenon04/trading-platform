<aside class="task-card">
	<div class="task-heading">
		<div class="task-icon">▤</div>
		<div><span class="eyebrow">Order activity</span><h2>Pending orders</h2></div>
	</div>

	<div class="task-list" role="list" aria-label="Pending orders">
		@for (task of tasks; track task.ticker) {
			<div class="task-row" role="listitem">
				<div class="ticker-badge">{{ task.ticker[0] }}</div>
				<strong class="ticker">{{ task.ticker }}</strong>
				<span class="quantity">{{ task.quantity }}</span>
				<span class="side" [class.sell]="task.side === 'Sell'">{{ task.side }}</span>
				<strong class="quoted-price">{{ task.quotedPrice }}</strong>
				<span class="status" [class]="task.status">● {{ task.status }}</span>
			</div>
		}
	</div>

	<a href="#">View order history <span>›</span></a>
</aside>
