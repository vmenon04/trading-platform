server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://api:8080;
    }

    location /auth/ {
        proxy_pass http://auth-service:3000;
    }

    location /logo/ {
        proxy_pass https://img.logo.dev/;
    }
}