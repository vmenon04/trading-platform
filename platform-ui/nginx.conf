# A template: when the container starts, the nginx image fills in ${LOGO_DEV_CRED_KEY} from the environment
# (docker-compose.yml passes it from the root .env), so the key is never baked into the image
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://api:8080;
    }

    location /auth/ {
        proxy_pass http://auth-service:3000;
    }

    # the analyst and admin pages' data (reporting-api); it checks the login token itself
    location /api/ {
        proxy_pass http://reporting-api:8050;
    }

    # /logo/ticker/AAPL -> https://img.logo.dev/ticker/AAPL with the publishable key added, like the dev proxy
    # (proxy.conf.mjs). img.logo.dev is served over TLS by a CDN, which needs the server name (SNI) and Host header
    location /logo/ {
        rewrite ^/logo/(.*)$ /$1?token=${LOGO_DEV_CRED_KEY}&format=png&size=64 break;
        proxy_pass https://img.logo.dev;
        proxy_ssl_server_name on;
        proxy_set_header Host img.logo.dev;
    }
}
