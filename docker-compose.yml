# Kafka, Postgres, Redis and the app for the trading platform
#
# All values come from .env 
# The app is one image run as four services, one per stage of the trade pipeline. 
# Scale a stage on its own with e.g. `docker compose up -d --scale execution=4`; at most
# KafkaTopicConfig.PARTITIONS containers of a stage get work, the rest wait as standbys.

name: trading-platform

# shared by the four app services: each one only switches its own stage on
x-app: &app
  build: .
  image: trading-platform-app
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 20s
  restart: unless-stopped

x-app-environment: &app-environment
  SPRING_KAFKA_BOOTSTRAP_SERVERS: ${HOST_IP:?HOST_IP is not set}:9092
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is not set}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is not set}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
  # Postgres creates the tables once (see the postgres service): schema.sql starts with DROP TABLE, so the app
  # must never run it, or every container start would wipe the database
  SPRING_SQL_INIT_MODE: never
  # Postgres allows 100 connections; 5 per container leaves room to scale
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
  MARKET_DATA_BASE_URL: ${MARKET_DATA_BASE_URL:?MARKET_DATA_BASE_URL is not set}
  MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:?MARKET_DATA_API_KEY is not set}
  MARKET_DATA_CACHE_TTL: ${MARKET_DATA_CACHE_TTL:?MARKET_DATA_CACHE_TTL is not set}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
  # Redis is only a price cache (prices come from Fauxnance when it is down), so it doesn't decide whether the app is UP
  MANAGEMENT_HEALTH_REDIS_ENABLED: "false"

services:
  kafka:
    # 3.9.1 matches the kafka-clients version the app uses
    image: apache/kafka:3.9.1
    container_name: trading-kafka
    ports:
      # published only on the machine's private IP, like Postgres
      - "${HOST_IP:?HOST_IP is not set}:9092:9092"
    environment:
      # a single node in KRaft mode: broker and controller in one process, no ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      # the address clients are told to reconnect to: must be reachable from the VM and Jenkins, never localhost
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${HOST_IP:?HOST_IP is not set}:9092
      # one broker, so every internal topic has one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    ports:
      # the host port is configurable because only some ports are open between the machines
      - "${HOST_IP:?HOST_IP is not set}:${POSTGRES_PORT:?POSTGRES_PORT is not set}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # run once, only when the data volume is empty (a new database)
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./src/main/resources/sample-data.sql:/docker-entrypoint-initdb.d/2-sample-data.sql:ro
    healthcheck:
      # $$ so the variables are read inside the container, not by compose
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  # caches Fauxnance prices for the validation and execution services
  redis:
    image: redis:7.4-alpine
    container_name: trading-redis
    # only a cache, so nothing is saved to disk (no snapshots, no append-only file)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}", "--save", "", "--appendonly", "no"]
    ports:
      # published like Postgres, so the app can use it when run on the VM
      - "${HOST_IP:?HOST_IP is not set}:${REDIS_PORT:?REDIS_PORT is not set}:6379"
    environment:
      # read by redis-cli, so the healthcheck can log in without the password on its command line
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  # receives POST /accounts/{accountId}/trades and publishes to trade.submitted
  api:
    <<: *app
    ports:
      - "${HOST_IP:?HOST_IP is not set}:${API_PORT:?API_PORT is not set}:8080"
    environment:
      <<: *app-environment
      TRADE_STAGE_API_ENABLED: "true"
      TRADE_STAGE_VALIDATION_ENABLED: "false"
      TRADE_STAGE_RECORDING_ENABLED: "false"
      TRADE_STAGE_EXECUTION_ENABLED: "false"

  # trade.submitted -> trade.validated
  validation:
    <<: *app
    environment:
      <<: *app-environment
      TRADE_STAGE_API_ENABLED: "false"
      TRADE_STAGE_VALIDATION_ENABLED: "true"
      TRADE_STAGE_RECORDING_ENABLED: "false"
      TRADE_STAGE_EXECUTION_ENABLED: "false"

  # trade.validated -> trade.recorded
  recording:
    <<: *app
    environment:
      <<: *app-environment
      TRADE_STAGE_API_ENABLED: "false"
      TRADE_STAGE_VALIDATION_ENABLED: "false"
      TRADE_STAGE_RECORDING_ENABLED: "true"
      TRADE_STAGE_EXECUTION_ENABLED: "false"

  # trade.recorded -> trade.finished
  execution:
    <<: *app
    environment:
      <<: *app-environment
      TRADE_STAGE_API_ENABLED: "false"
      TRADE_STAGE_VALIDATION_ENABLED: "false"
      TRADE_STAGE_RECORDING_ENABLED: "false"
      TRADE_STAGE_EXECUTION_ENABLED: "true"

volumes:
  postgres-data:
