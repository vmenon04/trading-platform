spring.application.name=trading-platform
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ftrade_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:schema.sql

mybatis.type-aliases-package=com.neueda.leap.entity
mybatis.configuration.map-underscore-to-camel-case=true

market.data.base-url=${MARKET_DATA_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
market.data.api-key=${MARKET_DATA_API_KEY:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:trading-platform-group}
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.template.default-topic=${TRADE_RECORDED_TOPIC:trade.recorded}

trade.validated=${TRADE_VALIDATED_TOPIC:trade.validated}
trade.recorded=${TRADE_RECORDED_TOPIC:trade.recorded}

management.endpoints.web.exposure.include=health,info
management.health.kafka.enabled=false
