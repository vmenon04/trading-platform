<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> F-trade - Register</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <img src="../../assets/nav-bar-logo.png" id="logo">
  </header>

  <main>
    <form id="register-form" novalidate>
      <h2>Register</h2>

      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          minlength="3"
          autocomplete="username"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
          autocomplete="current-password"
        />
      </div>

      <div class="field">
        <label for="first-name">First Name</label>
        <input
          type="text"
          id="first-name"
          name="first-name"
          required
          minlength="2"
        />
      </div>

      <div class="field">
        <label for="last-name">Last Name</label>
        <input
          type="text"
          id="last-name"
          name="last-name"
          required
          minlength="2"
        />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          minlength="2"
        />
      </div>

      <div class="field">
        <label for="dob">Birth Date</label>
        <input
          type="date"
          id="dob"
          name="dob"
          required        
          />
      </div>

      

      <p id="message" class="message hidden"></p>

      <button type="submit">Register</button>
    </form>
  </main>



  <script src="register-script.js"></script>
</body>
</html>
