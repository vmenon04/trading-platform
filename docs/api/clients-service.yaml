openapi: 3.0.3
info:
  title: Clients Service
  description: API for retrieving client information
  version: 1.0.0

servers:
  - url: /v1

paths:
  /clients/{client_id}:
    get:
      summary: Get client by id
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Client information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              example:
                client_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                client_name: "Jane Doe"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Client:
      type: object
      required: [client_id, client_name]
      properties:
        client_id:
          type: string
          format: uuid
        client_name:
          type: string

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

